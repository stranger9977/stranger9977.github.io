<!-- @dsCard group="Charts" name="Bar chart" subtitle="Stat comparison bars in card, honey vs muted" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar chart — The Side Quest DS</title><style>
  :root { color-scheme: light dark;
    --page:#f9f4e6; --surface:#fefbf1; --ink:#1c1304; --ink2:#5c5340; --muted:#8b8168;
    --grid:#eae1c8; --baseline:#cfc5a6; --honey:#eda100; --honey-text:#8a5d00;
    --green:#0c7a53; --crimson:#b3263c; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#0e0c07; --surface:#1a1712; --ink:#f7efdc; --ink2:#cbc1a7; --muted:#948a70;
      --grid:#2e2a1e; --baseline:#423b28; --honey-text:#eda100; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--page); color:var(--ink);
    font-family:Georgia,"Times New Roman",serif; font-size:17px; line-height:1.6; }
  .sans { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
</style></head>
<body>
<style>
.chart { background:var(--surface); border:1px solid var(--grid); border-radius:12px; padding:18px 20px; max-width:640px; font-family:system-ui,sans-serif; }
.chart h3 { margin:0 0 2px; font-size:1rem; font-weight:800; } .chart .sub { color:var(--muted); font-size:.8rem; margin:0 0 14px; }
.row { margin-bottom:12px; } .lab { font-size:.78rem; font-weight:700; color:var(--ink2); margin-bottom:4px; }
.bar { height:26px; border-radius:5px; } .val { font-size:.8rem; font-weight:800; margin-left:8px; }
.note { color:var(--muted); font-size:.78rem; margin-top:10px; }
</style>
<div class="chart"><h3>Buzz vs. silence, non-projected starters</h3><p class="sub">Share who finished the season startable · 2018–2025</p>
<div class="row"><div class="lab">Positive camp buzz</div><div style="display:flex;align-items:center"><div class="bar" style="width:78%;background:var(--honey)"></div><span class="val">16.4%</span></div></div>
<div class="row"><div class="lab">No camp buzz</div><div style="display:flex;align-items:center"><div class="bar" style="width:6%;background:var(--baseline)"></div><span class="val">1.3%</span></div></div>
<p class="note">A 13× lift: one hit in six tries, against one in 77 for the quiet guys.</p></div>
</body></html>
