<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masthead — The Side Quest DS</title><style>
  :root { color-scheme: light dark;
    --page:#f9f4e6; --surface:#fefbf1; --ink:#1c1304; --ink2:#5c5340; --muted:#8b8168;
    --grid:#eae1c8; --baseline:#cfc5a6; --honey:#eda100; --honey-text:#8a5d00;
    --green:#0c7a53; --crimson:#b3263c; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#0e0c07; --surface:#1a1712; --ink:#f7efdc; --ink2:#cbc1a7; --muted:#948a70;
      --grid:#2e2a1e; --baseline:#423b28; --honey-text:#eda100; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--page); color:var(--ink);
    font-family:Georgia,"Times New Roman",serif; font-size:17px; line-height:1.6; }
  .sans { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
</style></head>
<body>
<div class="sans" style="max-width:680px">
  <div style="font-weight:850;letter-spacing:.14em;font-size:1.35rem">THE SIDE QUEST<span style="color:var(--honey)">.</span></div>
  <div style="color:var(--ink2);font-size:.82rem;margin-top:2px">Interactive sports analytics, one rabbit hole at a time.</div>
  <div style="color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-top:8px">No. 001 · Fantasy Football · August 2026</div>
  <div style="height:7px;border-radius:3px;margin-top:14px;background:repeating-linear-gradient(-45deg,var(--honey) 0 9px,var(--ink) 9px 18px)"></div>
</div>
</body></html>
