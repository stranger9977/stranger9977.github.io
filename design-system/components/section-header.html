<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section header — The Side Quest DS</title><style>
  :root { color-scheme: light dark;
    --page:#f9f4e6; --surface:#fefbf1; --ink:#1c1304; --ink2:#5c5340; --muted:#8b8168;
    --grid:#eae1c8; --baseline:#cfc5a6; --honey:#eda100; --honey-text:#8a5d00;
    --green:#0c7a53; --crimson:#b3263c; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#0e0c07; --surface:#1a1712; --ink:#f7efdc; --ink2:#cbc1a7; --muted:#948a70;
      --grid:#2e2a1e; --baseline:#423b28; --honey-text:#eda100; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--page); color:var(--ink);
    font-family:Georgia,"Times New Roman",serif; font-size:17px; line-height:1.6; }
  .sans { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
</style></head>
<body>
<div style="max-width:640px">
<div class="sans" style="font-size:.8rem;letter-spacing:.14em;color:var(--green);font-weight:800">02</div>
<h2 class="sans" style="font-weight:850;font-size:1.35rem;letter-spacing:-.01em;margin:2px 0 10px">The headline number</h2>
<p>Sections auto-number via CSS counters; the number takes the post accent, the title stays ink.</p>
</div>
</body></html>
